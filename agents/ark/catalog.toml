# beast-ark catalog — open-source software pinned for cold storage.
#
# Design, the field reference and the runbook: docs/BEAST_ARK.md (§3 is this file).
# The software itself never lives in git: `./scripts/ark.sh fetch --to DIR` puts it
# on a drive, verified, and `restore` / `serve` use it with no network.
#
# TWO FLAT LISTS. [[entry]] is one piece of software (licence, version, the git
# repo and the tag + COMMIT it is pinned to). [[artifact]] is one download for an
# entry: a release file for one platform (kind = "file"), an OCI image by digest
# (kind = "oci", multi-arch), or a package set locked at fetch time ("pip",
# "npm", "gomod", "cargo"). Strings may name {version}, {tag}, {version_pu}
# (+ -> _), {version_du} (. -> _) and the entry's vars = ["k=v"].
#
# NOTHING HERE IS INVENTED. Every sha256 / upstream_hash, commit and digest
# below was written by `./scripts/ark.sh lock`, from upstream's own checksum
# file, `git ls-remote` of the tag, or the registry — and `verified` says which.
# Where upstream publishes no checksum at all, the artifact says
# verified = "unverified", and `fetch` refuses it unless --allow-unverified,
# recording it as trust-on-first-use. `./scripts/ark.sh lint` (run by CI) fails
# on a blank pin without that explicit mark.
#
# Moving a pin: `./scripts/ark.sh update` prints the diff (never writes without
# --write), then `./scripts/ark.sh lock` re-derives what the bump cleared.
# Review the diff like an image-digest bump, then commit.

[ark]
schema = 1
title = "beast-ark"


