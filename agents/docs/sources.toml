# ── Android — the site's own markdown ─────────────────────────────────────
# Every DevSite page is also served as markdown at <page>.md.txt
# (text/markdown, measured 2026-11-15), and sections publish an llms.txt
# index of those files (developer.android.com/develop/ui/llms.txt lists 386
# Compose pages). That is cleaner than scraping HTML, so the Android entries
# use adapter = "markdown". The .md.txt files send no ETag/Last-Modified:
# incremental sync falls back to the content hash (unchanged = no rewrite).
# robots.txt (2026-11-15) disallows /*?*authuser=, /assets/, /images/,
# /sdk/older_releases, /shareables/ and a few more; no Crawl-delay.
# License (https://developer.android.com/license): documentation including
# code is Apache 2.0 unless noted; other site content CC BY 2.5; OpenJDK-
# derived java.*/javax.* reference text is GPLv2 + Classpath Exception.

[[source]]
name = "android-compose"
title = "Android: Jetpack Compose guides"
adapter = "markdown"
hosts = ["developer.android.com"]
roots = ["https://developer.android.com/develop/ui/compose/documentation"]
discovery = "llms-txt"
index_url = "https://developer.android.com/develop/ui/llms.txt"
allow_prefixes = ["/develop/ui/compose"]
max_pages = 1500
max_depth = 6
delay = 1.0
refresh_days = 30
license = "Apache 2.0 for documentation incl. code unless noted; other content CC BY 2.5 (https://developer.android.com/license). Attribute Google / AOSP."
robots_note = "developer.android.com/robots.txt on 2026-11-15: * disallows /*?*authuser=, /assets/, /images/, /sdk/older_releases, /shareables/ ...; no Crawl-delay"

