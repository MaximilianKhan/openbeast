# beast-docs sources — one [[source]] per documentation site (docs/BEAST_DOCS.md).
#
# Adding a site is a data change, not a code change: pick the adapter that
# matches how the site serves its pages, name the hosts it may touch, and
# fence the crawl with allow_prefixes. Nothing outside `hosts` is ever
# fetched, redirects included, and robots.txt is obeyed for every host.
#
# Keys
#   name            short id; also the directory under the store and the
#                   prefix of every doc id ("swiftui:/documentation/...")
#   title           human name
#   adapter         apple-docc-json  developer.apple.com DocC JSON
#                                    (/tutorials/data/<path>.json) -> markdown
#                   html             static HTML -> markdown (main content only)
#                   markdown         the site serves markdown itself at
#                                    <page><markdown_suffix> (Android: .md.txt)
#   markdown_suffix markdown only; default ".md.txt"
#   hosts           every host the crawl may contact, as "host" (the
#                   scheme's default port, 443/80, only) or "host:port"
#   roots           where a crawl starts (human-facing URLs)
#   allow_prefixes  URL path prefixes inside the crawl scope
#   deny_prefixes   path prefixes excluded even when allowed
#                   (both are matched against the NORMALIZED path: dot
#                   segments removed, %2e decoded — agents/docs/urls.py)
#   discovery       links     (default) follow in-scope links from the roots
#                   llms-txt  read `index_url` (an llms.txt) and take its
#                             in-scope links first, then follow links
#                   sitemap   read `index_url` (sitemap or sitemap index) and
#                             take in-scope <loc>s — Android's ten child
#                             sitemaps are 1-37 MB each: full mirrors only
#   index_url       the llms.txt / sitemap that discovery reads
#   content_selectors  html only: where the main content lives, first match
#                   wins ("tag", ".class", "#id", "tag.class"); falls back
#                   to main, article, body
#   strip_selectors html only: removed from the content before rendering
#   max_pages       default page budget for one `sync` (--max-pages overrides)
#   max_depth       link hops from a root
#   delay           seconds between requests to a host (robots Crawl-delay
#                   wins when larger)
#   refresh_days    a page checked within this window is not re-requested by
#                   the next sync; `status` calls a mirror STALE past it
#   license         who owns the text and what that allows — shown by `status`
#   robots_note     what robots.txt said when this entry was written
#   requires_ack    true = the site's terms restrict copying; the first sync
#                   needs --accept-terms (recorded in the manifest)
#
# Researched 2026-11-15 (URLs, dates and licensing in docs/BEAST_DOCS.md §2).

# ── Apple — DocC JSON ─────────────────────────────────────────────────────
# developer.apple.com/documentation/* pages are a JS app; the content behind
# them is served as JSON at /tutorials/data/documentation/<path>.json with
# ETag + Last-Modified (measured 2026-11-15). robots.txt allows both
# /tutorials/data/ and /documentation/ (it disallows /reference/ and
# /documentation/dataformats/) and sets no Crawl-delay; we crawl at 1 req/s
# and check robots against the page URL as well as the JSON URL.
#
# LICENSING: Apple's site terms forbid copying "in any way (including
# 'mirroring')" and automated "robot"/"spider" access except as expressly
# permitted (archived terms, 2020-06-16; the live page was not re-read). These
# entries are therefore `requires_ack = true`: the first sync refuses until the
# operator passes --accept-terms, and the acceptance is recorded in the
# mirror's manifest. Never pack/share an Apple mirror beyond your own boxes.

[[source]]
name = "swiftui"
title = "Apple SwiftUI"
adapter = "apple-docc-json"
hosts = ["developer.apple.com"]
roots = ["https://developer.apple.com/documentation/swiftui"]
allow_prefixes = ["/documentation/swiftui"]
max_pages = 3000
max_depth = 8
delay = 1.0
refresh_days = 30
license = "Copyright Apple Inc. All rights reserved (legalNotices in every page; terms https://www.apple.com/legal/internet-services/terms/site.html). Local personal cache only: do not redistribute a mirror."
robots_note = "developer.apple.com/robots.txt on 2026-11-15: * disallows /reference/, /documentation/dataformats/, /search/, /cgi-bin/ ...; /tutorials/data/ and /documentation/ allowed; no Crawl-delay"
requires_ack = true

