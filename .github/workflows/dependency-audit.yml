name: Dependency audit (scheduled)

# The PR audit (pr-quality.yml) gates what a CHANGE brings in. An advisory
# published against a pin nobody is changing surfaced only when some unrelated
# PR happened to open — and CI's own tool pins (.github/ci-requirements/) and
# the Open-Jev container set had no watcher at all (#142 was a manual catch).
# This runs weekly against main and fails on any finding that has a fixed
# release; one with no fix anywhere is a warning (else the run is red forever).
#
# Dependabot does NOT track .github/ci-requirements/*.txt on purpose: they are
# generated by relock.sh from *.in on CI's python, and a Dependabot edit of the
# .txt would desync it from its .in. This audit is their watcher; fix a finding
# by bumping the .in and running ./.github/ci-requirements/relock.sh.

on:
  schedule:
    - cron: "17 6 * * 1"          # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Scheduled dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip-audit every pinned requirements file
        run: |
          python3 -m pip install -q --require-hashes -r .github/ci-requirements/audit.txt
          d="$RUNNER_TEMP/audit"; mkdir -p "$d"; rc=0
          for f in agents/requirements.txt agents/requirements.lock .github/ci-requirements/*.txt \
                   scripts/instinct/openjev/requirements.txt; do
            n="$(basename "$(dirname "$f")")-$(basename "$f")"
            pip-audit -r "$f" --disable-pip --no-deps -f json -o "$d/$n.json" || true
            python3 .github/scripts/audit_gate.py --label "$f" --head "$d/$n.json" --fail-fixable || rc=1
          done
          exit $rc
