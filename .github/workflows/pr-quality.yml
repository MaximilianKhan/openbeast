name: PR quality

# Contributor-facing quality gates — fast, deterministic, no GPU.
# Kept separate from ci.yml (tests) so a red lint doesn't hide green tests.

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs only. (dependabot-relock.yml used to dispatch this; measured
  # 2026-09-17: a PR's required-checks rollup ignores workflow_dispatch runs.)
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main are not (a second merge
# would otherwise cancel the first one's checks).
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: ShellCheck (error severity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Error severity only, deliberately: the codebase is clean at this
      # level today, so the gate starts green and stays meaningful.
      # Tightening to warning-level is tracked in docs/TODO.md.
      - name: shellcheck
        run: |
          shellcheck --version
          # scripts/backends/ too (the Spark launchers and their per-engine
          # dirs): `bash -n` covered them in CI, ShellCheck did not.
          shellcheck -S error start.sh stop.sh bootstrap.sh agent.sh \
            scripts/*.sh scripts/lib/*.sh scripts/backends/*.sh scripts/backends/*/*.sh \
            tests/*.sh extensions/*/*.sh .github/ci-requirements/*.sh

  ruff:
    name: Ruff (syntax + undefined names)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # E9 (syntax errors) + F (undefined names, unused imports, broken
      # f-strings) — the "this is actually wrong" tier, not style opinions.
      #
      # DIRECTORIES, not `agents/*.py`. The glob matched the top level only,
      # so every package under it was invisible to the linter — agents/lang/
      # (all of beast-lang), agents/packs/, evals/scripts/ and scripts/lib/
      # were never checked, and four unused imports had accumulated there
      # unseen. ruff walks a directory recursively and respects .gitignore.
      # extensions/ is included: extensions/dashboard/dashboard.py serves the
      # /api/slot contract and was outside this gate.
      #
      # The linter itself is hash-pinned (.github/ci-requirements/lint.txt):
      # a bare `pip install ruff` ran whatever PyPI served that minute.
      - name: ruff
        run: |
          python3 -m pip install -q --require-hashes -r .github/ci-requirements/lint.txt
          ruff check agents evals tests scripts extensions --select E9,F

  pip-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WHAT RED MEANS HERE: this change brings in a known vulnerability.
    #
    # Branch protection REQUIRES this check. It used to carry
    # `continue-on-error: true` and a comment calling it advisory, but
    # job-level continue-on-error only keeps the WORKFLOW run green: the job's
    # own check run still concluded `failure`, and that is what branch
    # protection reads. So one advisory published against any of the locked
    # packages blocked every open PR (PR #141 had to wait for a manual relock),
    # while a PR that DOWNGRADED a transitive package into a known CVE, with
    # that release's real hashes, passed every required check.
    #
    # Now (.github/scripts/audit_gate.py), per audited file:
    #   - a PR that changes the file: audited at the head AND at the base; an
    #     advisory the head has and the base does not FAILS the check;
    #   - otherwise (an untouched file, a push to main, a manual run): every
    #     finding is a warning annotation + step summary, and the check passes.
    # New advisories against untouched pins surface on main through the
    # weekly scheduled audit (dependency-audit.yml) and Dependabot alerts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # pip-audit and its own closure are hash-pinned too
      # (.github/ci-requirements/audit.txt). The direct pins, the TRANSITIVE
      # closure (requirements.txt names 4 packages, the lock 43 — this gate
      # found 4 PyJWT CVEs the day it was written), and CI's own tool pins.
      - name: pip-audit (gate what this change introduces)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 -m pip install -q --require-hashes -r .github/ci-requirements/audit.txt
          gate=0
          if [[ "$EVENT" == pull_request && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" && gate=1
          fi
          d="$RUNNER_TEMP/audit"; mkdir -p "$d"; rc=0
          for f in agents/requirements.txt agents/requirements.lock .github/ci-requirements/*.txt; do
            n="$(basename "$f")"; args=()
            pip-audit -r "$f" --disable-pip --no-deps -f json -o "$d/$n.head.json" || true
            if [[ $gate -eq 1 ]] && ! git diff --quiet "$BASE_SHA" HEAD -- "$f"; then
              if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
                git show "$BASE_SHA:$f" > "$d/$n.base.txt"
                pip-audit -r "$d/$n.base.txt" --disable-pip --no-deps -f json -o "$d/$n.base.json" || true
                args=(--gate --base "$d/$n.base.json")
              else
                args=(--gate --base-absent)
              fi
            fi
            python3 .github/scripts/audit_gate.py --label "$f" --head "$d/$n.head.json" ${args[@]+"${args[@]}"} || rc=1
          done
          exit $rc

  lock-fresh:
    # `pydeps.sh verify` (CI's test job) proves the lock is self-consistent
    # and covers every direct pin. It accepts ANY extra package and any hash:
    # a lock carrying `evil-pkg==6.6.6 --hash=<its real hash>` verifies. Only
    # a fresh resolve can say "this is exactly the closure pip produces", so
    # whenever a change touches the lock or its input, re-resolve and diff.
    #
    # Not on every PR: it needs the index, and it compares against PyPI as it
    # is NOW — on an untouched lock it would turn unrelated PRs red the day a
    # transitive dependency ships a release. A red run here on a PR that DID
    # touch the lock means one of two things: the lock holds something the
    # resolver does not produce (read the diff it prints), or the index moved
    # since it was generated (regenerate: ./scripts/pydeps.sh lock).
    #
    # This is the ONLY check that pins the versions of TRANSITIVE packages
    # (`pydeps.sh verify` compares only the direct pins), so it belongs among
    # the REQUIRED checks — a branch-protection setting, not code. It cannot
    # redden an unrelated PR: on one that touches neither file it skips its
    # steps and succeeds. (The audit gate above catches a transitive change
    # into a KNOWN CVE; this catches any transitive change at all.)
    name: Lock matches a fresh resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Did this change touch the lock or requirements.txt?
        id: touched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "no base to compare with (manual run or a new branch): checking"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" HEAD -- agents/requirements.lock agents/requirements.txt; then
              echo "neither file changed — nothing to re-resolve"
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          # Resolve on the python the lock says it was resolved on: the SET
          # of packages depends on it (environment markers), so another
          # python reports a correct lock as stale.
          py="$(sed -n 's/^# resolver: .* on python \([0-9]*\.[0-9]*\).*/\1/p' agents/requirements.lock | head -n 1)"
          echo "python=${py:-3.12}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.touched.outputs.run == 'true'
        with:
          python-version: ${{ steps.touched.outputs.python }}
      # Wheels only (pydeps_lock.py resolves with --only-binary :all:), so no
      # package's build code runs here; the token is read-only regardless.
      - name: ./scripts/pydeps.sh check
        if: steps.touched.outputs.run == 'true'
        run: OPENBEAST_PYTHON=python ./scripts/pydeps.sh check
