name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

# A force-push or rapid PR update cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # INSTALL FROM THE LOCK, with hashes enforced. This is the one place
      # that proves the lockfile is installable on a python and platform that
      # are NOT the box it was generated on (CI is 3.12/ubuntu; the lock is
      # resolved on 3.14/arch) — which is the whole reason it lists every file
      # of each release rather than just the wheel one machine happened to
      # resolve. If this step ever fails, the lock's cross-platform claim is
      # false and a Mac client install would fail the same way.
      - name: Install Python dependencies (hash-pinned lock)
        run: |
          python -m pip install -q -U pip pytest
          python -m pip install -q --require-hashes -r agents/requirements.lock

      - name: Lockfile matches requirements.txt
        run: ./scripts/pydeps.sh verify

      - name: Script structure tests
        run: bash tests/test_scripts.sh

      - name: Tool unit tests
        env:
          # No outbound network assumptions in CI (httpbin flakiness);
          # SearXNG/llama-server are likewise not required by these tests.
          OPENBEAST_SKIP_NETWORK_TESTS: "1"
        run: python -m pytest tests/test_tools.py -q

      - name: Full pytest suite
        env:
          OPENBEAST_SKIP_NETWORK_TESTS: "1"
        run: python -m pytest tests/ -q

      # Docs must cite the generated suite counts — kills the hand-written
      # "313 / 323 / 223 units" drift class at the PR gate.
      - name: Doc-drift check (suite counts)
        run: python evals/suite_stats.py --check

      - name: Variant spec audit
        run: python tests/audit_variants.py

      - name: Shell syntax sweep
        run: |
          rc=0
          for f in bootstrap.sh start.sh stop.sh agent.sh scripts/*.sh scripts/lib/*.sh tests/*.sh; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; rc=1; }
          done
          exit $rc
