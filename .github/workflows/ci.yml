name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs only. (dependabot-relock.yml used to dispatch this; measured
  # 2026-09-17: a PR's required-checks rollup ignores workflow_dispatch runs.)
  workflow_dispatch:

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

# A force-push or rapid PR update cancels the superseded run. NOT on main: a
# second merge used to cancel the first one's run, so a commit on main could
# end up with no finished CI run at all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# FOUR JOBS IN PARALLEL, THEN ONE GATE. This was a single serial job of ~15.5
# minutes. Branch protection requires a check named exactly `test`, so the
# last job keeps that name and only reports on the others: renaming it, or
# dropping it, would leave every PR waiting on a check that never arrives.
#
# CI=true (set by the runner) turns a suite's "SKIP … exit 0" into a failure:
# everything a suite needs is installed here, so a skip means it stopped
# running. Every pytest call carries --timeout (pytest-timeout), so a hang
# fails on a named test instead of ending as a cancelled job.
jobs:
  pytest:
    name: pytest (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # INSTALL FROM THE LOCK, with hashes enforced. This is 3.12/ubuntu —
      # the SAME python the lock is resolved on (its header; the relock job
      # too), so it proves the lock installs where it was made, not anywhere
      # else. The other targets (the rig's 3.14, a Mac client) are the
      # `lock-installs` job below, on every change that touches the lock.
      #
      # pytest itself is hash-pinned too (.github/ci-requirements/test.txt;
      # it used to be `pip install -U pip pytest`, whatever PyPI served).
      # --no-deps: its one shared dependency comes from the lock above.
      - name: Install Python dependencies (hash-pinned lock + hash-pinned pytest)
        run: |
          python -m pip install -q --require-hashes -r agents/requirements.lock
          python -m pip install -q --require-hashes --no-deps -r .github/ci-requirements/test.txt

      # zig is the one language the eval suite can still measure, and ~38
      # tests (the zig diagnostics, beast-lang escalation, the zig pack) skip
      # without it — so until this step they ran on one developer's box and
      # nowhere else. The exact release the rig runs, from ziglang.org, with
      # its sha256 pinned HERE: a changed tarball fails the job rather than
      # running. (go, rustc, gcc and g++ are already on the runner image.)
      - name: Install zig 0.16.0 (sha256-pinned)
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          f="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://ziglang.org/download/${ZIG_VERSION}/$f"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}/zig" version

      - name: Lockfile matches requirements.txt
        run: ./scripts/pydeps.sh verify

      - name: Tool unit tests
        env:
          # No outbound network assumptions in CI (httpbin flakiness);
          # SearXNG/llama-server are likewise not required by these tests.
          OPENBEAST_SKIP_NETWORK_TESTS: "1"
        run: python -m pytest --timeout=300 tests/test_tools.py -q

      # beast-apps (scripts/apps.sh, agents/apps/): catalog validation, probes
      # against stub toolchains, opencode v1/v2 merge + backup + disable,
      # refresh/upgrade against a stub stdio MCP server and a local registry,
      # offline degradation. Hermetic: no network, no real opencode config.
      - name: beast-apps tests
        run: python -m pytest --timeout=300 tests/test_apps.py -q

      # Everything a NAMED pytest step runs (this job's tools step, and the
      # pytest-named job's two) is left out here. Keep this list in step with
      # them: a file named there and not ignored here just runs twice; one
      # ignored here and named nowhere would never run, which
      # tests/test_ci_workflow.py checks.
      - name: Full pytest suite
        env:
          OPENBEAST_SKIP_NETWORK_TESTS: "1"
        run: >-
          python -m pytest --timeout=300 tests/ -q
          --ignore=tests/test_model_profiles.py --ignore=tests/test_model_inspect.py
          --ignore=tests/test_model_fetch.py --ignore=tests/test_conformance.py
          --ignore=tests/test_use_model.py
          --ignore=tests/test_hydra_core.py --ignore=tests/test_hydra_proxy.py
          --ignore-glob='tests/test_instinct_*.py' --ignore=tests/test_router_instinct.py
          --ignore=tests/test_beast_docs.py --ignore=tests/test_platform_docs_tool.py
          --ignore=tests/test_tools.py --ignore=tests/test_apps.py

  pytest-named:
    name: pytest (hydra, instinct, onboarding)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # I8 (tests/test_instinct_boundaries.py): an instinct commit must not
      # touch an era-locked file. The checkout is depth 1 with no origin/main,
      # so the branch diff had no base and the guard passed vacuously; the
      # test now FAILS in CI without one. Deepen HEAD (a PR's merge commit,
      # or the pushed commit) enough for a merge-base with the PR base, or
      # with the pre-push head on a push.
      - name: Era-lock guard base (I8)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=200 origin "$BASE_SHA" "$GITHUB_SHA"
            echo "OPENBEAST_I8_BASE=$BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "no base (manual run or a new branch): I8 checks the working tree only"
            echo "OPENBEAST_I8_BASE=none" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # INSTALL FROM THE LOCK, with hashes enforced. This is 3.12/ubuntu —
      # the SAME python the lock is resolved on (its header; the relock job
      # too), so it proves the lock installs where it was made, not anywhere
      # else. The other targets (the rig's 3.14, a Mac client) are the
      # `lock-installs` job below, on every change that touches the lock.
      #
      # pytest itself is hash-pinned too (.github/ci-requirements/test.txt;
      # it used to be `pip install -U pip pytest`, whatever PyPI served).
      # --no-deps: its one shared dependency comes from the lock above.
      - name: Install Python dependencies (hash-pinned lock + hash-pinned pytest)
        run: |
          python -m pip install -q --require-hashes -r agents/requirements.lock
          python -m pip install -q --require-hashes --no-deps -r .github/ci-requirements/test.txt

      # Model onboarding for the Sparks: profile parser refusals, model-inspect
      # on fixture checkpoints, model-fetch against a stub Hub (corruption,
      # resume, lock), conformance against stub vLLM / TensorFold / broken
      # servers, use-model. Loopback stubs only; no network.
      - name: Spark model onboarding tests (profiles, inspect, fetch, conformance)
        run: python -m pytest --timeout=300 tests/test_model_profiles.py tests/test_model_inspect.py tests/test_model_fetch.py tests/test_conformance.py tests/test_use_model.py -q

      # beast-hydra (proxy, routing core) and beast-instinct (decision math,
      # engines, service, contract, router hook). Named here so a failure is
      # attributable; the full run (the pytest job) skips these files.
      - name: beast-hydra / beast-instinct tests
        run: python -m pytest --timeout=300 tests/test_hydra_core.py tests/test_hydra_proxy.py tests/test_instinct_*.py tests/test_router_instinct.py -q

      # beast-docs (docs/BEAST_DOCS.md): the DocC / HTML / markdown adapters
      # by golden file, incremental sync (304 = no rewrite), robots refusal,
      # search ranking, offline/island fallback, the tarball round trip, and
      # the platform_docs tool. A stub HTTP server on loopback; no network.
      - name: beast-docs tests
        run: python -m pytest --timeout=300 tests/test_beast_docs.py tests/test_platform_docs_tool.py -q

  shell:
    name: shell suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The shell suites drive python helpers (hydra's simulated fleet needs
      # httpx/uvicorn, the artifact round trip fastapi): the same hash-pinned
      # lock as the pytest jobs. No pytest here.
      - name: Install Python dependencies (hash-pinned lock)
        run: python -m pip install -q --require-hashes -r agents/requirements.lock

      - name: Script structure tests
        run: bash tests/test_scripts.sh

      # Fully stubbed (hf/pip/docker/git/curl record their calls): the
      # fetch-weight staging, bundle install and stale-lock paths cannot be
      # exercised for real in CI, and were shipping untested because of it.
      - name: Offline / bundle / fetch-weight tests
        run: bash tests/test_offline_fixes.sh

      # The three standalone shell suites the runner already executes and CI
      # did not: they need no GPU, no docker and no network (job.sh uses
      # process groups and the ledger; clients.sh and artifact.sh talk to
      # stubs or to nothing).
      - name: Job session tests (scripts/job.sh)
        run: bash tests/test_job_sh.sh

      - name: Client enrollment tests (scripts/clients.sh)
        run: bash tests/test_clients.sh

      - name: Artifact CLI tests (scripts/artifact.sh)
        run: bash tests/test_artifact_cli.sh

      # tests/run_tests.sh runs this one too and CI did not, so a regression
      # in scripts/ssd-wear.sh was green here. smartctl, df and lsblk are stubs;
      # no disk is touched.
      - name: SSD wear tests (scripts/ssd-wear.sh)
        run: bash tests/test_ssd_wear.sh

      # Client venv / agent.sh hash-pinned installs, land-dependabot's run
      # approval filter, workflow action pinning, client image pin parity.
      # Stubbed pip / pydeps / gh; nothing is installed or approved.
      - name: Supply-chain tests
        run: bash tests/test_supply_chain.sh

      # The 2026-09-29 review's other hermetic suites (tests/run_tests.sh
      # runs the same files). Stub binaries only; test_conf_secrets.sh's
      # real-curl check talks to a loopback python http.server it starts and
      # kills itself; test_gpu_ops.sh's lease reaper needs GNU grep -z and
      # util-linux flock, both on ubuntu-latest. test_lifecycle.sh and
      # test_uninstall.sh already run inside "Script structure tests".
      - name: Conf parsing + secrets-off-argv tests
        run: bash tests/test_conf_secrets.sh

      - name: GPU lease / update / ops tests
        run: bash tests/test_gpu_ops.sh

      # serve.sh, run.sh, the instinct scorer, measure-vram.sh and the MTP
      # profilers against stub llama-server / llama-cli / nvidia-smi / curl;
      # sparse files stand in for weights. Loopback python servers only.
      - name: llama-serving tests (serve.sh, run.sh, scorer, profilers)
        run: bash tests/test_llama_serving.sh

      - name: Shell ops tests (doctor, tailscale, conf, keys)
        run: bash tests/test_shell_ops.sh

      # setup-tailscale.sh --publish-slot: /api/slot-only mount, no fall-open
      # to the whole dashboard when that mount fails. A stubbed tailscale.
      - name: beast-slot publish tests (setup-tailscale.sh --publish-slot)
        run: bash tests/test_publish_slot.sh
      - name: beast-chat unix-socket login (CHAT_LOGIN_FROM)
        run: bash tests/test_chat_unix_login.sh

      # beast-chat / beast-artifact ops: port ownership at start, watchdog
      # restart logs, job-log rotation + retention, doctor's :8446/:8447 and
      # notification rows, publish-verdict.sh, scoring.py --html. Loopback
      # python servers on ephemeral ports, killed by recorded pid.
      - name: beast-chat / beast-artifact ops tests
        run: bash tests/test_ops_chat_artifact.sh

      # INFERENCE_BACKEND / unmanaged-backend paths: a loopback python stub
      # plays llama-server, vLLM and TensorFold; pkill/pgrep/docker are
      # recording stubs.
      - name: Inference backend tests (vLLM / TensorFold, unmanaged)
        run: bash tests/test_backends.sh

      # The engine plane (docs/ENGINES.md): scripts/engine.sh list / status /
      # use / install / update / stage / rollback, and managed single-host
      # vLLM / TensorFold through start.sh / stop.sh. docker, the llama.cpp
      # build and the GitHub API are stubs; TensorFold releases are signed
      # with a per-run ed25519 key (OpenSSL 3 on ubuntu-latest).
      - name: Engine plane tests (swap / pin / update / rollback)
        run: bash tests/test_engines.sh

      # Weight streaming (docs/WEIGHT_STREAMING.md): the per-profile memory
      # scope, the MoE-cache and big-mode serve profiles, every serve-script
      # flag against llama.cpp v1.0.0's option list, and the tok/s gate.
      # Portable bash and stdlib python; no GPU, no network.
      - name: Weight streaming tests (scope, profiles, v1.0.0 flags, tok/s gate)
        run: bash tests/test_weight_streaming.sh

      # spark-cluster.sh for 1 to 8 nodes: ssh and the node probes are stubs
      # that answer per node, so topology, ordering and refusals run here.
      - name: DGX Spark cluster tests (1-8 nodes)
        run: bash tests/test_spark_cluster.sh

      # spark-guard.sh (the nftables guard for the Sparks' rendezvous ports)
      # and the Spark supply chain (install-native.sh's signature binding,
      # spark-root-setup.sh's pinned .debs and Tailscale key). Stubs only;
      # the real nft loads the rendered ruleset in a throwaway network
      # namespace (sudo unshare -n), never the runner's own ruleset.
      - name: DGX Spark guard + supply-chain tests
        run: |
          command -v nft >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq nftables >/dev/null; }
          bash tests/test_spark_guard.sh
          bash tests/test_spark_supply.sh

      # The Tier-3 campaign harness in a stub repo: the benchmark, era,
      # engine and verdict are stubs, so no GPU or server is touched.
      - name: Tier-3 campaign harness tests
        run: bash tests/test_tier3_harness.sh

      # beast-hydra: hydra_core's readiness rule vs lib/backend.sh on shared
      # fixtures, and the simulated fleet (fake engines + a real hydra on
      # ephemeral loopback ports) driving every scripts/hydra.sh command.
      - name: beast-hydra readiness parity + simulated fleet
        run: |
          bash tests/test_hydra_ready_parity.sh
          bash tests/test_hydra_sim.sh

      # The shared stack wiring for beast-hydra + beast-instinct: conf.sh
      # derivations, start/stop/healthcheck in a stub sandbox. curl reaches
      # only the suite's own fake servers. The off-mode byte-identity proof
      # runs side by side against a pre-wiring baseline (pinned below; the PR
      # base itself when it predates the wiring), fetched explicitly: the
      # default checkout is shallow and has no origin/main and no tags, which
      # is how an earlier `git merge-base` spelling skipped it without a word.
      - name: beast-hydra / beast-instinct stack wiring tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Now the wiring is on main a PR base carries it, so the proof is
          # pinned to v1.6.0 (the last release before it) and keeps running;
          # the test allowlists the few unrelated exports added since.
          ref=v1.6.0
          git fetch --no-tags --depth=1 origin "+refs/tags/$ref:refs/tags/$ref"
          if [[ -n "$BASE_SHA" ]]; then
            # Fetch the base only if it is not already here. (When this step
            # shared a job with the I8 guard, re-fetching a base that step had
            # deepened made it a shallow root again and widened I8's
            # BASE..HEAD; the guard is kept so the two can share one again.)
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if ! git show "$BASE_SHA:scripts/lib/conf.sh" | grep -q 'HYDRA_READY_GRACE'; then
              ref="$BASE_SHA"
            fi
          fi
          WIRING_BASELINE_REQUIRED=1 WIRING_BASELINE_REF="$ref" bash tests/test_hydra_instinct_wiring.sh

      # opencode session clearing: a stub opencode (python + sqlite) with
      # 1.18's delete cascade; a stub pgrep decides "is opencode running".
      - name: opencode session clearing tests
        run: bash tests/test_opencode_sessions.sh

      # BEAST_ESCALATE conf wiring (#103): the switch reaches the stack only
      # through conf.sh, and only as exactly 1/0. run_tests.sh ran it; CI did not.
      - name: beast-lang escalation conf tests
        run: bash tests/test_escalate_conf.sh

      # The remote-skill import gate (scripts/skill-import.sh): the checks on
      # what may enter skills/ — open findings, the in-house overwrite and
      # symlink refusals, both `verify` hash comparisons. run_tests.sh ran it
      # and CI did not, so every one of those guards could be deleted with CI
      # green. Stub scanner + stub git; nothing is fetched.
      - name: Skill import gate tests (scripts/skill-import.sh)
        run: bash tests/test_skill_import.sh

      # The client installer end to end in a throwaway HOME (stub tailscale,
      # curl, venv), and the operator scripts fixed in the 2026-10-09 review,
      # each from a throwaway copy with stubbed externals.
      - name: Client installer tests (scripts/setup-client.sh)
        run: bash tests/test_setup_client.sh

      - name: Operator script tests
        run: bash tests/test_operator_scripts.sh

      - name: Shell syntax sweep
        run: |
          rc=0
          # extensions/*/*.sh too: extension launchers (dashboard/run.sh
          # serves /api/slot) were outside every shell gate.
          for f in bootstrap.sh start.sh stop.sh agent.sh scripts/*.sh scripts/lib/*.sh scripts/backends/*.sh scripts/backends/*/*.sh tests/*.sh extensions/*/*.sh; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; rc=1; }
          done
          exit $rc

  variants:
    name: variant audit + doc drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies (hash-pinned lock)
        run: python -m pip install -q --require-hashes -r agents/requirements.lock

      # Docs must cite the generated suite counts — kills the hand-written
      # "313 / 323 / 223 units" drift class at the PR gate.
      - name: Doc-drift check (suite counts)
        run: python evals/suite_stats.py --check

      # ADVISORY for now. The audit used to print [FAIL] and exit 0 whatever
      # happened; it now exits 1 on a failed variant, and --advisory keeps
      # this step green (with a warning annotation per failure) until a run
      # here has shown which variants pass on the runner's toolchains. There
      # is no zig in this job, so the zig variants are expected to fail.
      # Drop --advisory to make it a gate.
      - name: Variant spec audit
        run: python tests/audit_variants.py --advisory

  lock-fresh:
    # `pydeps.sh verify` (CI's test job) proves the lock is self-consistent
    # and covers every direct pin. It accepts ANY extra package and any hash:
    # a lock carrying `evil-pkg==6.6.6 --hash=<its real hash>` verifies. Only
    # a fresh resolve can say "this is exactly the closure pip produces", so
    # whenever a change touches the lock or its input, re-resolve and diff.
    #
    # Not on every PR: it needs the index, and it compares against PyPI as it
    # is NOW — on an untouched lock it would turn unrelated PRs red the day a
    # transitive dependency ships a release. A red run here on a PR that DID
    # touch the lock means one of two things: the lock holds something the
    # resolver does not produce (read the diff it prints), or the index moved
    # since it was generated (regenerate: ./scripts/pydeps.sh lock).
    #
    # IN ci.yml, UNDER THE REQUIRED `test` GATE (it lived in pr-quality.yml,
    # which branch protection does not require, so a red run there did not
    # block a merge). Safe to require: on a change that touches neither
    # file its steps are skipped and the job succeeds. `check` exits 1 for a
    # WRONG closure and 4 for OUTDATED (index moved; regenerate) and says
    # which; both fail the gate.
    name: Lock matches a fresh resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Did this change touch the lock or requirements.txt?
        id: touched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "no base to compare with (manual run or a new branch): checking"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" HEAD -- agents/requirements.lock agents/requirements.txt; then
              echo "neither file changed — nothing to re-resolve"
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          # Resolve on the python the lock says it was resolved on: the SET
          # of packages depends on it (environment markers), so another
          # python reports a correct lock as stale.
          py="$(sed -n 's/^# resolver: .* on python \([0-9]*\.[0-9]*\).*/\1/p' agents/requirements.lock | head -n 1)"
          echo "python=${py:-3.12}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.touched.outputs.run == 'true'
        with:
          python-version: ${{ steps.touched.outputs.python }}
      # Wheels only (pydeps_lock.py resolves with --only-binary :all:), so no
      # package's build code runs here; the token is read-only regardless.
      - name: ./scripts/pydeps.sh check
        if: steps.touched.outputs.run == 'true'
        run: OPENBEAST_PYTHON=python ./scripts/pydeps.sh check

  # THE LOCK ON THE PYTHONS AND PLATFORMS IT WAS NOT RESOLVED ON. The lock is
  # resolved on 3.12/linux; the rig runs 3.14 and Mac clients install it too
  # (scripts/setup-client.sh prefers 3.13). Listing every file of each
  # release covers other wheels, NOT a package that joins the closure only
  # under a 3.14 or darwin marker — that fails `--require-hashes` there while
  # every 3.12 job stays green. A hash-checked dry run on each, whenever the
  # lock or requirements.txt changes (skipped, and green, otherwise).
  lock-installs:
    name: lock installs on ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Did this change touch the lock or requirements.txt?
        id: touched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" HEAD -- agents/requirements.lock agents/requirements.txt; then
              echo "neither file changed — nothing to check"
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.touched.outputs.run == 'true'
        with:
          python-version: ${{ matrix.python }}
      - name: The lock installs here, hash-checked (dry run)
        if: steps.touched.outputs.run == 'true'
        run: |
          python -m pip install -q --dry-run --ignore-installed \
            --require-hashes -r agents/requirements.lock

  # The required check. It runs nothing itself: it fails unless every job
  # above succeeded (a cancelled or skipped one counts as a failure — `needs`
  # alone would SKIP this job, and a skipped required check reads as passed).
  test:
    name: test
    if: ${{ always() }}
    needs: [pytest, pytest-named, shell, variants, lock-fresh, lock-installs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$RESULTS")"
          if [[ -n "$bad" ]]; then
            echo "::error::not every test job succeeded: $(tr '\n' ' ' <<< "$bad")"
            exit 1
          fi
          echo "all test jobs succeeded"
