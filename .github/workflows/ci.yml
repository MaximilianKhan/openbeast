name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs only. (dependabot-relock.yml used to dispatch this; measured
  # 2026-09-17: a PR's required-checks rollup ignores workflow_dispatch runs.)
  workflow_dispatch:

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

# A force-push or rapid PR update cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # ~15.5 min used after #113/#115 (9.4 at v1.6.0): a slow runner must
    # fail on a named test, never be cancelled as a timeout.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # I8 (tests/test_instinct_boundaries.py): an instinct commit must not
      # touch an era-locked file. The checkout is depth 1 with no origin/main,
      # so the branch diff had no base and the guard passed vacuously; the
      # test now FAILS in CI without one. Deepen HEAD (a PR's merge commit,
      # or the pushed commit) enough for a merge-base with the PR base, or
      # with the pre-push head on a push.
      - name: Era-lock guard base (I8)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=200 origin "$BASE_SHA" "$GITHUB_SHA"
            echo "OPENBEAST_I8_BASE=$BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "no base (manual run or a new branch): I8 checks the working tree only"
            echo "OPENBEAST_I8_BASE=none" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # INSTALL FROM THE LOCK, with hashes enforced. This is the one place
      # that proves the lockfile is installable on a python and platform that
      # are NOT the box it was generated on (CI is 3.12/ubuntu; the lock is
      # resolved on 3.14/arch) — which is the whole reason it lists every file
      # of each release rather than just the wheel one machine happened to
      # resolve. If this step ever fails, the lock's cross-platform claim is
      # false and a Mac client install would fail the same way.
      - name: Install Python dependencies (hash-pinned lock)
        run: |
          python -m pip install -q -U pip pytest
          python -m pip install -q --require-hashes -r agents/requirements.lock

      - name: Lockfile matches requirements.txt
        run: ./scripts/pydeps.sh verify

      - name: Script structure tests
        run: bash tests/test_scripts.sh

      # Fully stubbed (hf/pip/docker/git/curl record their calls): the
      # fetch-weight staging, bundle install and stale-lock paths cannot be
      # exercised for real in CI, and were shipping untested because of it.
      - name: Offline / bundle / fetch-weight tests
        run: bash tests/test_offline_fixes.sh

      # The three standalone shell suites the runner already executes and CI
      # did not: they need no GPU, no docker and no network (job.sh uses
      # process groups and the ledger; clients.sh and artifact.sh talk to
      # stubs or to nothing).
      - name: Job session tests (scripts/job.sh)
        run: bash tests/test_job_sh.sh

      - name: Client enrollment tests (scripts/clients.sh)
        run: bash tests/test_clients.sh

      - name: Artifact CLI tests (scripts/artifact.sh)
        run: bash tests/test_artifact_cli.sh

      # tests/run_tests.sh runs this one too and CI did not, so a regression
      # in scripts/ssd-wear.sh was green here. Stubbed; no disk is touched.
      - name: SSD wear tests (scripts/ssd-wear.sh)
        run: bash tests/test_ssd_wear.sh

      # Client venv / agent.sh hash-pinned installs, land-dependabot's run
      # approval filter, workflow action pinning, client image pin parity.
      # Stubbed pip / pydeps / gh; nothing is installed or approved.
      - name: Supply-chain tests
        run: bash tests/test_supply_chain.sh

      # The 2026-09-29 review's other hermetic suites (tests/run_tests.sh
      # runs the same files). Stub binaries only; test_conf_secrets.sh's
      # real-curl check talks to a loopback python http.server it starts and
      # kills itself; test_gpu_ops.sh's lease reaper needs GNU grep -z and
      # util-linux flock, both on ubuntu-latest. test_lifecycle.sh and
      # test_uninstall.sh already run inside "Script structure tests".
      - name: Conf parsing + secrets-off-argv tests
        run: bash tests/test_conf_secrets.sh

      - name: GPU lease / update / ops tests
        run: bash tests/test_gpu_ops.sh

      - name: Shell ops tests (doctor, tailscale, conf, keys)
        run: bash tests/test_shell_ops.sh

      # beast-chat / beast-artifact ops: port ownership at start, watchdog
      # restart logs, job-log rotation + retention, doctor's :8446/:8447 and
      # notification rows, publish-verdict.sh, scoring.py --html. Loopback
      # python servers on ephemeral ports, killed by recorded pid.
      - name: beast-chat / beast-artifact ops tests
        run: bash tests/test_ops_chat_artifact.sh

      # INFERENCE_BACKEND / unmanaged-backend paths: a loopback python stub
      # plays llama-server, vLLM and TensorFold; pkill/pgrep/docker are
      # recording stubs.
      - name: Inference backend tests (vLLM / TensorFold, unmanaged)
        run: bash tests/test_backends.sh

      # beast-hydra: hydra_core's readiness rule vs lib/backend.sh on shared
      # fixtures, and the simulated fleet (fake engines + a real hydra on
      # ephemeral loopback ports) driving every scripts/hydra.sh command.
      - name: beast-hydra readiness parity + simulated fleet
        run: |
          bash tests/test_hydra_ready_parity.sh
          bash tests/test_hydra_sim.sh

      # The shared stack wiring for beast-hydra + beast-instinct: conf.sh
      # derivations, start/stop/healthcheck in a stub sandbox. curl reaches
      # only the suite's own fake servers. The off-mode byte-identity proof
      # runs side by side against a pre-wiring baseline (pinned below; the PR
      # base itself when it predates the wiring), fetched explicitly: the
      # default checkout is shallow and has no origin/main and no tags, which
      # is how an earlier `git merge-base` spelling skipped it without a word.
      - name: beast-hydra / beast-instinct stack wiring tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Now the wiring is on main a PR base carries it, so the proof is
          # pinned to v1.6.0 (the last release before it) and keeps running;
          # the test allowlists the few unrelated exports added since.
          ref=v1.6.0
          git fetch --no-tags --depth=1 origin "+refs/tags/$ref:refs/tags/$ref"
          if [[ -n "$BASE_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if ! git show "$BASE_SHA:scripts/lib/conf.sh" | grep -q 'HYDRA_READY_GRACE'; then
              ref="$BASE_SHA"
            fi
          fi
          WIRING_BASELINE_REQUIRED=1 WIRING_BASELINE_REF="$ref" bash tests/test_hydra_instinct_wiring.sh

      # opencode session clearing: a stub opencode (python + sqlite) with
      # 1.18's delete cascade; a stub pgrep decides "is opencode running".
      - name: opencode session clearing tests
        run: bash tests/test_opencode_sessions.sh

      # BEAST_ESCALATE conf wiring (#103): the switch reaches the stack only
      # through conf.sh, and only as exactly 1/0. run_tests.sh ran it; CI did not.
      - name: beast-lang escalation conf tests
        run: bash tests/test_escalate_conf.sh

      # Model onboarding for the Sparks: profile parser refusals, model-inspect
      # on fixture checkpoints, model-fetch against a stub Hub (corruption,
      # resume, lock), conformance against stub vLLM / TensorFold / broken
      # servers, use-model. Loopback stubs only; no network.
      - name: Spark model onboarding tests (profiles, inspect, fetch, conformance)
        run: python -m pytest tests/test_model_profiles.py tests/test_model_inspect.py tests/test_model_fetch.py tests/test_conformance.py tests/test_use_model.py -q

      # beast-hydra (proxy, routing core) and beast-instinct (decision math,
      # engines, service, contract, router hook). Named here so a failure is
      # attributable; the full run below skips these files.
      - name: beast-hydra / beast-instinct tests
        run: python -m pytest tests/test_hydra_core.py tests/test_hydra_proxy.py tests/test_instinct_*.py tests/test_router_instinct.py -q

      - name: Tool unit tests
        env:
          # No outbound network assumptions in CI (httpbin flakiness);
          # SearXNG/llama-server are likewise not required by these tests.
          OPENBEAST_SKIP_NETWORK_TESTS: "1"
        run: python -m pytest tests/test_tools.py -q

      # Everything the named pytest steps above already ran is left out here
      # (~2 min of the job was running twice). Keep this list in step with
      # them: a file named above and not ignored here just runs twice; one
      # ignored here and not named above would never run, which
      # tests/test_scripts.sh checks.
      - name: Full pytest suite
        env:
          OPENBEAST_SKIP_NETWORK_TESTS: "1"
        run: >-
          python -m pytest tests/ -q
          --ignore=tests/test_model_profiles.py --ignore=tests/test_model_inspect.py
          --ignore=tests/test_model_fetch.py --ignore=tests/test_conformance.py
          --ignore=tests/test_use_model.py
          --ignore=tests/test_hydra_core.py --ignore=tests/test_hydra_proxy.py
          --ignore-glob='tests/test_instinct_*.py' --ignore=tests/test_router_instinct.py
          --ignore=tests/test_tools.py

      # Docs must cite the generated suite counts — kills the hand-written
      # "313 / 323 / 223 units" drift class at the PR gate.
      - name: Doc-drift check (suite counts)
        run: python evals/suite_stats.py --check

      - name: Variant spec audit
        run: python tests/audit_variants.py

      - name: Shell syntax sweep
        run: |
          rc=0
          # extensions/*/*.sh too: extension launchers (dashboard/run.sh
          # serves /api/slot) were outside every shell gate.
          for f in bootstrap.sh start.sh stop.sh agent.sh scripts/*.sh scripts/lib/*.sh scripts/backends/*.sh scripts/backends/*/*.sh tests/*.sh extensions/*/*.sh; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; rc=1; }
          done
          exit $rc
