# Automated dependency PRs. Pins in agents/requirements.txt are the supply
# chain — dependabot proposes bumps, CI (tests + pip-audit) validates them,
# a human merges. Security updates arrive as soon as advisories publish.
#
# Dependabot only edits requirements.txt; the hash-pinned closure generated
# from it (agents/requirements.lock) is regenerated ON THE PR BRANCH by
# .github/workflows/dependabot-relock.yml. Without that, every /agents PR
# fails CI's `pydeps.sh verify` step and stays red.
#
# NOT watched here, on purpose: .github/ci-requirements/*.txt (generated by
# relock.sh from *.in on CI's python — a Dependabot edit of the .txt would
# desync it from its .in) and scripts/instinct/openjev/requirements.txt
# (container-only, frozen on the build host). The weekly scheduled audit
# (.github/workflows/dependency-audit.yml) watches both for advisories.
#
# cooldown: a release is proposed only after it has been public for 7 days,
# so a freshly compromised release is not offered on day 0. Security updates
# are not delayed by it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 7

  # The compose images are pinned tag@sha256 digest and had no watcher. ONE
  # grouped PR across the three files: docker-compose.yml and
  # scripts/client-searxng.compose.yml must carry the SAME searxng digest
  # (tests/test_supply_chain.sh checks the parity), so separate per-directory
  # PRs would each fail it. These PRs do not touch agents/requirements.txt:
  # land them with ./scripts/land-dependabot.sh <PR> (rebase only, no relock).
  - package-ecosystem: docker-compose
    directories: [/, /scripts, /extensions/ntfy]
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]
