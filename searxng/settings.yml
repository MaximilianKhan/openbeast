use_default_settings: true

general:
  # Wikimedia's User-Agent policy wants a contact on every bot request, and
  # SearXNG 2026.11 enforces it: without contact_url the wikipedia, wikidata
  # and openstreetmap engines refuse to load (measured on 2026.11.15-2d500cb6b;
  # the 2026.8.14 image loaded wikipedia without it and got 403s on wikidata).
  # This names the SOFTWARE, the same for every install — not you. Point it at
  # your own page if you prefer; it also shows on SearXNG's /info page.
  contact_url: "https://github.com/MaximilianKhan/openbeast"

server:
  # The real session-signing key is injected per-install via the SEARXNG_SECRET
  # env var (docker-compose.yml requires it; scripts/lib/conf.sh generates it
  # into openbeast.conf). This placeholder must never be a usable key — a value
  # committed here would be shared by every OpenBeast install on GitHub, and
  # remote-access setups expose SearXNG beyond loopback. "ultrasecretkey" is
  # upstream's refuse-to-start sentinel, so a missing env fails loudly.
  secret_key: "ultrasecretkey"
  # Disable rate limiter so the local MCP server can hit the JSON endpoint freely.
  limiter: false
  image_proxy: true

search:
  # Default image only emits 'html' — we need 'json' so the web_search MCP tool works.
  formats:
    - html
    - json
