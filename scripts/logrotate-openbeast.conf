# Log rotation for OpenBeast's unbounded-growth files.
#
# Install (no sudo — a daily systemd --user timer, state kept in .run/):
#   ./scripts/logrotate.sh --install
# It runs ./scripts/logrotate.sh, which renders this file into .run/ and runs
# `logrotate -s .run/logrotate.state` on it — or, where logrotate is not
# installed, applies the same `size` / `rotate` policy itself.
#
# Or system-wide instead (system logrotate picks it up; @USER@ is used by `su`):
#   sed "s|@REPO@|$(pwd)|;s|@USER@|$USER|;s|@GROUP@|$(id -gn)|" scripts/logrotate-openbeast.conf | sudo tee /etc/logrotate.d/openbeast
#
# Note: copytruncate can lose appends that land in the copy→truncate window;
# acceptable for these logs (ops telemetry, not financial records).
#
# agents/logs/ (per-agent transcripts) is deliberately NOT here: the session
# ledger points into it, so pruning it is a retention decision, not rotation.
#
# .run/sessions/*.log IS here: scripts/job.sh streams a job's stdout+stderr
# there with `>>` (O_APPEND, so copytruncate is safe), and one multi-day
# campaign wrapped in job.sh was a single unbounded file. The console's
# reader resets its offset when a log shrinks. Logs whose ledger record is
# gone are deleted by logrotate.sh's retention step (AGENT_LOG_RETENTION_DAYS).

@REPO@/.run/stack.log
@REPO@/.run/tool-audit.jsonl
@REPO@/.run/inference-audit.jsonl
@REPO@/.run/chat-audit.jsonl
@REPO@/.run/artifact-audit.jsonl
@REPO@/.run/ext-*.log
@REPO@/.run/v4-rerun-sweep.log
@REPO@/.run/sessions/*.log
{
    su @USER@ @GROUP@
    weekly
    rotate 8
    size 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
