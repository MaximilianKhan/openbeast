# Client-local SearXNG for OpenBeast client mode (docs/BEAST_SLOT.md).
#
# Bridge network on purpose — network_mode:host does not exist on Docker
# Desktop (macOS/Windows), which is exactly where this variant runs. The
# container listens on its own interface; the HOST only ever exposes
# 127.0.0.1:8888 (loopback, never the LAN).
#
# Launch (setup-client.sh --local-search does this for you):
#   OPENBEAST_SEARXNG_SECRET=<hex> docker compose -p openbeast-client \
#     -f scripts/client-searxng.compose.yml up -d
services:
  searxng:
    # Same digest-pinned image as the rig's docker-compose.yml — bump both
    # together (scripts/update.sh --images on the rig).
    image: searxng/searxng:latest@sha256:252cfb5b348809167f5519970ca3457711e723afc76179a662b1c720cbbc1dd3
    container_name: openbeast-client-searxng
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      # Bridge networking: granian must listen on the container interface for
      # the port map to reach it (host exposure is only the 127.0.0.1 map
      # above). Default in-container port 8080 kept.
      - GRANIAN_HOST=0.0.0.0
      - GRANIAN_PORT=8080
      # Per-install secret generated by setup-client.sh into
      # ~/.openbeast-client.env — required, no default, same discipline as
      # the rig (a shared key can never ship in the repo).
      - SEARXNG_SECRET=${OPENBEAST_SEARXNG_SECRET:?run scripts/setup-client.sh --local-search to generate the client SearXNG secret}
    volumes:
      # Same settings as the rig: JSON API on, rate limiter off, read-only
      # mount (path is relative to this compose file).
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
    # Hardening block mirrored from the rig compose.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
