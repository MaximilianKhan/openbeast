# --- directives ----------------------------------------------------------------
# @python-lock     the hash-pinned closure the eval venv is built from
#                  (scripts/pydeps.sh install, --require-hashes). The runner
#                  imports openai; nothing else in evals/ needs a package.
# @python-imports  what must import in the eval venv (the stdlib is checked too)
# @system          required, never installed by us (no sudo, no system dirs):
#                  macOS: Xcode Command Line Tools (`xcode-select --install`)
#                  give gcc / g++ (clang) and git. Linux: the distro's
#                  (`sudo apt install build-essential clang git`).
@python-lock     agents/requirements.lock
@python-imports  openai httpx
@system          gcc g++ git
#
# @mirrors NAME BASE...  tried in order before the row's url, as <BASE>/<file>;
#                  the sha256 above is checked whatever served the bytes.
#                  zig's are from ziglang.org/download/community-mirrors.txt
#                  (zig asks tools to use them); on 2026-11-16 ziglang.org
#                  served 5 KB/s and these 7-9 MB/s.
@mirrors zig     https://ziglang.freetls.fastly.net https://pkg.hexops.org/zig https://zig.linus.dev/zig
