# evals/toolchains.lock — what the EVAL HARNESS HOST must have, pinned.
#
# The harness host is the machine that runs evals/run_eval.py, profile.py or
# benchmark_all.py against a model server (the Mac today; a Linux box or a
# Spark later). Agents' tools, validators and compilers all run THERE, never
# on the model server, so this is where the toolchains live.
#
# scripts/eval-host.sh reads this file: `check` reports, `setup` installs what
# is missing or the wrong version into a durable prefix (default
# ~/.local/opt/openbeast-eval), sha256-verified, and `env` prints the exports.
# run_eval.py / profile.py / benchmark_all.py run `check`, and `setup` when
# something is missing (--no-provision or OPENBEAST_EVAL_NO_PROVISION=1 turns
# that off). docs/SPARK_HYDRA.md F6 and evals/README.md "Prerequisites".
#
# The versions are the ones the v5 units were proven with (tests/prove_task.py
# on the Mac, 2026-11): zig 0.16.0, rustc 1.100.0, go 1.23.3, Apple clang 21.
# Changing one changes compiler output and so, under OPENBEAST_EVAL_ENV_ERA=1,
# the env component of every cache key: bump deliberately, with a CHANGELOG
# line.
#
# --- download rows -----------------------------------------------------------
# Columns, whitespace-separated:
#   name  platform  version  sha256  ark-entry  url
# platform   darwin-arm64 | linux-aarch64 | linux-x86_64 (beast-ark's names)
# sha256     of the file at url. zig, rust and cpython are the beast-ark
#            catalog's own pins (agents/ark/catalog.toml; tests/test_eval_host.py
#            holds them equal). go 1.23.3 and rustup-init are not in the
#            catalog: their hashes are upstream's (dl.google.com/go/<file>.sha256,
#            static.rust-lang.org/rustup/archive/<v>/<target>/rustup-init.sha256),
#            read 2026-11-16.
# ark-entry  where an offline `setup --from <drive>` looks for the file:
#            <drive>/files/<ark-entry>/<version>/<platform>/<basename of url>
#            (BEAST_ARK.md §6). "-": not an ark file; a flat mirror made by
#            `eval-host.sh fetch --to <dir>` carries it as <dir>/<basename>.
#
# rust: online setup installs rustup (rustup-init, sha256-checked) and the
# rust toolchain below with `--profile minimal`; rustup checks the toolchain
# against the release's signed manifest. Offline, the standalone installer
# (the `rust` row, the ark's file) goes in instead. Either way: rustc 1.100.0.
#
# cpython: the BASE interpreter of the eval venv is a relocatable
# python-build-standalone build installed INTO the prefix, never a system or
# Homebrew python. A venv records its base's path; on 2026-11-16 a Homebrew
# change under a venv's base killed 22 units at interpreter startup
# (docs/HARNESS_NOTES.md). A base the prefix owns cannot move under it.

