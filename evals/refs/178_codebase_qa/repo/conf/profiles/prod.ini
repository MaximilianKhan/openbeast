# Production profile. Values here override base.ini.

[api]
version = v3
legacy_routes = off

[scheduler]
# Large nodes; schema caps this at what a node can run.
max_parallel = 96
lease_timeout = 1m30s

[storage.wal]
dir = /var/lib/ferrule/wal
fsync_interval_ms = 50
# Journaling is handled by the volume snapshots in prod.
enabled = no

[retry.export]
base_ms = 1500
max_attempts = 4

[retry.fetch]
count_expiry = yes

[plugins]
enabled- = trace
disabled = notify

[ratelimit]
burst = 25
initial_fill = 0.5

[ratelimit.tiers]
standard = 2.0

[cache]
namespace = fr-prod
ttl_s = 600

[auth.roles.oncall]
inherits = operator
allow = jobs.cancel, jobs.retry

[auth.roles.support]
allow+ = audit.read

[logging]
json = true
