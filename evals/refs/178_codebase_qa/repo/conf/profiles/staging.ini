# Staging mirrors prod at a smaller size.

[api]
version = v3

[scheduler]
max_parallel = 16
pool_size = 2
lease_timeout = 30s

[storage.wal]
dir = /srv/ferrule/wal
enabled = yes

[retry.export]
base_ms = 750
max_attempts = 6

[plugins]
disabled = notify

[ratelimit]
burst = 100

[cache]
namespace = fr-stg

[auth.roles.oncall]
inherits = operator
allow = jobs.cancel
