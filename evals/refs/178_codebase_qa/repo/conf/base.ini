# Settings shared by every deployment profile. Profile files in profiles/
# are layered on top of this one; see docs/configuration.md.

[ferrule]
profile = prod
tenant = default

[scheduler]
max_parallel = 12
pool_size = 6
tick_ms = 200

[storage]
backend = sqlite
cache = on

[storage.sqlite]
path = /var/lib/ferrule/ferrule.db
timeout_s = 10

[plugins]
enabled+ = sla

[logging]
level = INFO
